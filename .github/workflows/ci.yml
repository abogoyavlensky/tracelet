name: ci

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Go, Node, golangci-lint and rite at the versions pinned in .mise.toml,
      # so CI runs exactly what `rite check` runs locally.
      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: rite web-install

      - name: Format check, lint, test
        run: rite check

      - name: Build
        run: rite build

      - name: Smoke test the binary
        run: ./bin/tracelet version
