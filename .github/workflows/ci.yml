name: ci

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than ubuntu-latest: the binary links DuckDB's static
    # library against the runner's glibc, so the image decides the oldest
    # glibc a release build runs on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Go, Node, golangci-lint and rite at the versions pinned in .mise.toml,
      # so CI runs exactly what `rite check` runs locally.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ matrix.arch }}-

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install frontend dependencies
        run: rite web-install

      - name: Format check, lint, test
        run: rite check

      - name: Build
        run: rite build

      - name: Smoke test the binary
        run: ./bin/tracelet version
