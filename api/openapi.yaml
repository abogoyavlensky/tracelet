openapi: 3.1.0
info:
  title: Tracelet API
  version: v1
  description: |
    Management and query API under /api/v1/, and the OTLP/HTTP logs and
    traces receivers at /v1/logs and /v1/traces.

    Every route except health, this document, and signing in and out needs
    a bearer token (`Authorization: Bearer tl_...`). Tokens have one scope:

    - `ingest`: writes telemetry to one project, through /v1/logs and
      /v1/traces only.
    - `read`: reads one project, or every project when created without one.
    - `admin`: everything, including projects and tokens.

    The web UI signs in by posting an `admin` or `read` token to
    /api/v1/session, which sets the `tracelet_session` cookie. The cookie
    authenticates routes under /api/ like a bearer token; OTLP routes ignore
    it. Use one token per browser, so one device can be revoked alone.

    Errors are JSON objects `{"error": "..."}`. A 503 carries `Retry-After`.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
  - cookie: []

paths:
  /v1/logs:
    post:
      summary: Ingest OTLP/HTTP logs
      description: |
        An OTLP `ExportLogsServiceRequest` in protobuf, optionally gzipped.
        Needs an `ingest` token. The body may be at most 4 MB, before and
        after decompression. A 200 means the records are stored. OTLP/JSON is
        not supported yet and gets 415.
      operationId: ingestLogs
      security:
        - bearer: []
      parameters:
        - name: Content-Encoding
          in: header
          schema: { type: string, enum: [gzip, identity] }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: |
            An `ExportLogsServiceResponse`; its `partial_success` names
            rejected records and the reason.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/traces:
    post:
      summary: Ingest OTLP/HTTP traces
      description: |
        An OTLP `ExportTraceServiceRequest` in protobuf, optionally gzipped.
        Needs an `ingest` token. The body may be at most 4 MB, before and
        after decompression. A 200 means the spans are stored. A span whose
        project, trace ID, and span ID are already stored in the hot window is
        dropped and counted as `duplicate_spans` on health, so a retried
        request does not store spans twice. `trace_state` and `flags` are not
        stored. OTLP/JSON is not supported yet and gets 415.
      operationId: ingestTraces
      security:
        - bearer: []
      parameters:
        - name: Content-Encoding
          in: header
          schema: { type: string, enum: [gzip, identity] }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: |
            An `ExportTraceServiceResponse`; its `partial_success` names
            rejected spans and the reason.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/metrics:
    post:
      summary: Ingest OTLP/HTTP metrics
      description: |
        An OTLP `ExportMetricsServiceRequest` in protobuf, optionally gzipped.
        Needs an `ingest` token. The body may be at most 4 MB, before and
        after decompression. A 200 means the points are stored. Gauges, sums,
        and explicit-bucket histograms are accepted. Exponential histograms,
        summaries, delta up-down counters, and invalid points are rejected
        and named in `partial_success`. A point whose series, start time, and
        time are already stored in the hot window is dropped and counted as
        `duplicate_points` on health. Exemplars are not stored. OTLP/JSON is
        not supported yet and gets 415.
      operationId: ingestMetrics
      security:
        - bearer: []
      parameters:
        - name: Content-Encoding
          in: header
          schema: { type: string, enum: [gzip, identity] }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: |
            An `ExportMetricsServiceResponse`; its `partial_success` names
            rejected data points and the reason.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/health:
    get:
      summary: Server health and counters
      operationId: health
      security: []
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/openapi.yaml:
    get:
      summary: This document
      operationId: openapi
      security: []
      responses:
        "200":
          description: The OpenAPI description
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/session:
    post:
      summary: Sign in
      description: |
        Checks an `admin` or `read` token and sets the `tracelet_session`
        cookie to it: `HttpOnly`, `SameSite=Strict`, `Path=/api/`, valid for
        30 days, and `Secure` when the request came over HTTPS (directly or
        with `X-Forwarded-Proto: https`). Revoking the token ends the
        session. An `ingest` token gets 403. A cross-origin browser request
        gets 403.
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      summary: The signed-in token
      description: |
        Needs a `read` token, from the cookie or a bearer header. Lists the
        projects the token may read.
      operationId: getSession
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: Sign out
      description: Clears the session cookie. The token stays valid.
      operationId: signOut
      security: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/projects:
    get:
      summary: List projects
      description: Needs an `admin` token.
      operationId: listProjects
      responses:
        "200":
          description: Projects by slug
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a project
      description: Needs an `admin` token.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              additionalProperties: false
              properties:
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$" }
                name: { type: string, description: Defaults to the slug. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/tokens:
    get:
      summary: List tokens
      description: Needs an `admin` token. Shows prefixes, never plaintexts.
      operationId: listTokens
      responses:
        "200":
          description: Tokens, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a token
      description: |
        Needs an `admin` token. The plaintext is in the response and cannot
        be retrieved again. An ingest token needs a project; an admin token
        cannot have one; a read token without one reads every project.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, name]
              additionalProperties: false
              properties:
                project: { type: string, description: Project slug. }
                scope: { $ref: "#/components/schemas/Scope" }
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Token"
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: "The plaintext, tl_ plus 40 hex characters." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/tokens/{id}:
    delete:
      summary: Revoke a token
      description: Needs an `admin` token.
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/logs:
    get:
      summary: Search logs
      description: |
        Needs a `read` token. Results are newest first. The first page
        resolves `last` into an absolute range; `next_cursor` carries that
        range, so later pages read the same window. A request with `cursor`
        must not send `from`, `to`, or `last`. Without any of them the range
        is the last hour.
      operationId: searchLogs
      parameters:
        - $ref: "#/components/parameters/Project"
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - name: level
          in: query
          description: Minimum severity.
          schema: { type: string, enum: [trace, debug, info, warn, error, fatal] }
        - { name: q, in: query, description: Case-insensitive substring of the body., schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - name: attr
          in: query
          description: Repeatable `key:value`, an exact match on a top-level attribute.
          explode: true
          schema: { type: array, items: { type: string } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/traces/{trace_id}:
    get:
      summary: Get one trace
      description: |
        Needs a `read` token. Every span of the trace in the range, oldest
        first and flat; nest them by `parent_span_id`. Without `from`, `to`,
        or `last` the range is the last 7 days; widen it to find an older
        trace. At most 5,000 spans are returned, with `truncated` set past
        that. A trace with no spans in the range is a 404 naming the range.
      operationId: getTrace
      parameters:
        - name: trace_id
          in: path
          required: true
          description: 32 hex characters, case-insensitive.
          schema: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
      responses:
        "200":
          description: The trace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/spans:
    get:
      summary: Search spans
      description: |
        Needs a `read` token. Results are newest first, with the same range
        and cursor rules as logs search; without a range it is the last hour.
        `root=true` lists root spans, which stands in for a list of traces: a
        trace whose root span was never exported does not appear there.
      operationId: searchSpans
      parameters:
        - $ref: "#/components/parameters/Project"
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: name, in: query, description: Exact span name., schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unset, ok, error] } }
        - name: min_duration
          in: query
          description: A positive Go duration, such as `500ms`; spans at least this long.
          schema: { type: string }
        - name: root
          in: query
          description: When true, only spans without a parent.
          schema: { type: boolean }
        - { name: trace_id, in: query, schema: { type: string } }
        - name: attr
          in: query
          description: Repeatable `key:value`, an exact match on a top-level attribute.
          explode: true
          schema: { type: array, items: { type: string } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpansPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/services:
    get:
      summary: Services with logs, spans, or metric points in a range
      description: Needs a `read` token. Busiest first, by the three counts together.
      operationId: listServices
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [items, range]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [service, logs, spans, points]
                      properties:
                        service: { type: string }
                        logs: { type: integer }
                        spans: { type: integer }
                        points: { type: integer, description: Metric points. }
                  range: { $ref: "#/components/schemas/Range" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/metrics:
    get:
      summary: List metrics
      description: |
        Needs a `read` token. The metrics with points in the range, one item
        per name and kind, ordered by name, at most 1,000 with `truncated`
        set past that. Without a range it is the last hour.
      operationId: listMetrics
      parameters:
        - $ref: "#/components/parameters/Project"
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the name., schema: { type: string } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/metrics/attributes:
    get:
      summary: Attribute keys of one metric
      description: |
        Needs a `read` token. The point attribute keys of the metric in the
        range, ordered by key, at most 100, each with its number of distinct
        values and the first 20 values in order. Use them for `group_by` and
        `attr` in a metric query.
      operationId: metricAttributes
      parameters:
        - $ref: "#/components/parameters/Project"
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricAttributes" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/metrics/query:
    get:
      summary: Query a metric over time
      description: |
        Needs a `read` token. The metric aggregated per step and group.
        Aggregations depend on the kind; the first listed is the default:
        a monotonic sum takes `rate` (per second) or `increase`; a gauge or
        non-monotonic sum takes `avg`, `min`, `max`, or `sum`; a histogram
        takes a quantile `pNN` or `pNN.N` (default `p95`), `rate`
        (observations per second), or `avg`.

        Counter and histogram values come from per-series deltas with reset
        detection; a series that started inside the range counts its first
        point in full. A step's value comes from the points whose time falls
        in it, so the last step, which usually extends past `to`, can read
        low until it completes. Steps with no data are null, never zero.

        The range start is aligned down to the step, and the response's
        `range` reports the aligned start. Without `step` the server picks
        one of about 200 per range and at least a minute. At most 20 series
        are returned, largest first, with `truncated` set past that. A
        metric with no points in the range is a 404 naming the range; a name
        with several kinds in the range is a 400 listing them.
      operationId: queryMetric
      parameters:
        - $ref: "#/components/parameters/Project"
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: aggregate, in: query, schema: { type: string } }
        - name: group_by
          in: query
          description: "`service`, `environment`, `version`, or a point attribute key."
          schema: { type: string }
        - { name: service, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - name: attr
          in: query
          description: Repeatable `key:value`, an exact match on a point attribute.
          explode: true
          schema: { type: array, items: { type: string } }
        - name: step
          in: query
          description: A Go duration of whole seconds, at least `10s`, giving at most 1,500 steps.
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Last"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A Tracelet token, `tl_` plus 40 hex characters.
    cookie:
      type: apiKey
      in: cookie
      name: tracelet_session
      description: |
        Set by signing in; holds the token. Accepted only under /api/.
        Non-safe cross-origin browser requests carrying it are refused.

  parameters:
    Project:
      name: project
      in: query
      description: |
        Project slug. Required for an all-projects token; a project-scoped
        token may only name its own project.
      schema: { type: string }
    From:
      name: from
      in: query
      description: RFC 3339 start, inclusive.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: RFC 3339 end, exclusive.
      schema: { type: string, format: date-time }
    Last:
      name: last
      in: query
      description: A Go duration ending now, such as `30m` or `2h`. Excludes `from` and `to`.
      schema: { type: string }

  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Busy, out of disk, or out of time; retry after `Retry-After` seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Scope:
      type: string
      enum: [ingest, read, admin]
    Session:
      type: object
      required: [scope, token_name, projects]
      properties:
        scope: { type: string, enum: [read, admin] }
        token_name: { type: string }
        project: { type: string, description: The token's project slug; absent for admin and all-project tokens. }
        projects:
          type: array
          description: The projects the token may read.
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string }
    Project:
      type: object
      required: [id, slug, name, created_at]
      properties:
        id: { type: string, description: Immutable; stored in telemetry. }
        slug: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      required: [id, scope, name, prefix, created_at]
      properties:
        id: { type: string }
        project: { type: string, description: Project slug; absent for admin and all-project tokens. }
        scope: { $ref: "#/components/schemas/Scope" }
        name: { type: string }
        prefix: { type: string, description: The first 6 characters after tl_. }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    Range:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    Log:
      type: object
      required: [ts, service, severity_number, body]
      properties:
        ts: { type: string, format: date-time }
        observed_ts: { type: string, format: date-time }
        service: { type: string }
        environment: { type: string }
        version: { type: string }
        severity_number: { type: integer }
        severity_text: { type: string }
        body: { type: string }
        trace_id: { type: string }
        span_id: { type: string }
        scope: { type: string }
        resource: { type: object }
        attributes: { type: object }
    LogsPage:
      type: object
      required: [items, range, limit, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Log" }
        next_cursor: { type: string }
        range: { $ref: "#/components/schemas/Range" }
        limit: { type: integer }
        truncated: { type: boolean, description: True when next_cursor is present. }
    Span:
      type: object
      required: [ts, end_ts, duration_ns, service, trace_id, span_id, name, kind, status_code]
      properties:
        ts: { type: string, format: date-time, description: The span's start. }
        end_ts: { type: string, format: date-time }
        duration_ns: { type: integer }
        service: { type: string }
        environment: { type: string }
        version: { type: string }
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string, description: Absent on a root span. }
        name: { type: string }
        kind:
          type: integer
          description: "The OTLP span kind: 0 unspecified, 1 internal, 2 server, 3 client, 4 producer, 5 consumer."
        status_code:
          type: integer
          description: "The OTLP status code: 0 unset, 1 ok, 2 error."
        status_message: { type: string }
        scope: { type: string }
        resource: { type: object }
        attributes: { type: object }
        events:
          type: array
          items:
            type: object
            required: [name]
            properties:
              ts: { type: string, format: date-time }
              name: { type: string }
              attributes: { type: object }
        links:
          type: array
          items:
            type: object
            required: [trace_id, span_id]
            properties:
              trace_id: { type: string }
              span_id: { type: string }
              attributes: { type: object }
    SpansPage:
      type: object
      required: [items, range, limit, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Span" }
        next_cursor: { type: string }
        range: { $ref: "#/components/schemas/Range" }
        limit: { type: integer }
        truncated: { type: boolean, description: True when next_cursor is present. }
    Trace:
      type: object
      description: |
        One trace's spans. `start`, `end`, `duration_ns`, and `services`
        describe the returned spans, which is the whole trace unless
        `truncated` is true; then the later part of the trace is missing
        from them too. To find the trace's logs, search logs with `trace_id`
        from `start` to a little past `end`, since `to` is exclusive (and
        equals `start` for a single span without an end time).
      required: [trace_id, start, end, duration_ns, services, spans, range, truncated]
      properties:
        trace_id: { type: string }
        start: { type: string, format: date-time, description: The earliest span start. }
        end: { type: string, format: date-time, description: The latest span end. }
        duration_ns: { type: integer }
        services:
          type: array
          items: { type: string }
        spans:
          type: array
          items: { $ref: "#/components/schemas/Span" }
        range: { $ref: "#/components/schemas/Range" }
        truncated: { type: boolean, description: True when the trace has more than 5,000 spans in the range. }
    MetricKind:
      type: object
      required: [type, monotonic]
      properties:
        type: { type: string, enum: [gauge, sum, histogram] }
        monotonic: { type: boolean, description: For sums; a monotonic sum is a counter. }
        unit: { type: string }
    MetricInfo:
      allOf:
        - $ref: "#/components/schemas/MetricKind"
        - type: object
          required: [name, services, series, points, last_ts]
          properties:
            name: { type: string }
            services: { type: array, items: { type: string } }
            series: { type: integer }
            points: { type: integer }
            last_ts: { type: string, format: date-time }
    MetricsList:
      type: object
      required: [items, range, truncated]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MetricInfo" } }
        range: { $ref: "#/components/schemas/Range" }
        truncated: { type: boolean }
    MetricAttributes:
      type: object
      required: [name, items, range]
      properties:
        name: { type: string }
        items:
          type: array
          items:
            type: object
            required: [key, distinct, values]
            properties:
              key: { type: string }
              distinct: { type: integer }
              values: { type: array, items: { type: string } }
        range: { $ref: "#/components/schemas/Range" }
    MetricResult:
      allOf:
        - $ref: "#/components/schemas/MetricKind"
        - type: object
          required: [name, aggregate, step_seconds, range, timestamps, series, truncated]
          properties:
            name: { type: string }
            aggregate: { type: string }
            group_by: { type: string }
            step_seconds: { type: integer }
            range: { $ref: "#/components/schemas/Range" }
            timestamps:
              type: array
              description: Every step start in the range.
              items: { type: string, format: date-time }
            series:
              type: array
              items:
                type: object
                required: [group, values]
                properties:
                  group:
                    type: object
                    description: The group_by key and this series' value; empty without group_by.
                    additionalProperties: { type: string }
                  values:
                    type: array
                    description: One value per timestamp, null where the step has no data.
                    items: { type: [number, "null"] }
                  incompatible_series:
                    type: integer
                    description: For histogram quantiles, series whose bucket bounds differ from the merged ones and are left out.
            truncated: { type: boolean }
    Health:
      type: object
      required: [status, version, ready]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        ready: { type: boolean }
        storage_error: { type: string }
        ingest:
          type: object
          properties:
            accepted_rows: { type: integer }
            rejected_rows: { type: integer }
            unknown_service_records: { type: integer }
            duplicate_spans: { type: integer, description: Spans dropped because the same span was already stored in the hot window. }
            duplicate_points: { type: integer, description: Metric points dropped because the same point was already stored in the hot window. }
            overloaded_requests: { type: integer }
            commits: { type: integer }
            failed_commits: { type: integer }
            queue_depth: { type: integer }
            last_commit: { type: string, format: date-time }
            last_commit_latency_ns: { type: integer }
        storage:
          type: object
          properties:
            hot_hours:
              type: object
              additionalProperties: { type: integer }
            cold_files: { type: integer }
            cold_bytes: { type: integer }
            disk_free: { type: integer }
            disk_pressure: { type: boolean }
            last_flush: { type: string, format: date-time }
            last_flush_duration_ns: { type: integer }
            last_flush_error: { type: string }
            last_retention:
              type: object
              properties:
                at: { type: string, format: date-time }
                files_deleted: { type: integer }
                bytes_freed: { type: integer }
                error: { type: string }
